<body>
<h1>PIN Maker</h1>
<p>One line per person: Name,PIN. Up to 20 people. Everything stays on your phone.</p>
<div class="card">
<textarea id="in" placeholder="Admin,7391&#10;Mary,4826&#10;John,1357"></textarea>
<div class="warn" id="warn"></div>
<button id="go">Generate</button>
</div>
<div class="card"><h2>1. Paste into lock.js</h2><p>Replace the whole USERS list.</p><pre id="o1"></pre><button class="cp" data-t="o1">Copy</button></div>
<div class="card"><h2>2. Names for the sheet</h2><p>Paste into Access_Users, cell B2 (Name column).</p><pre id="o2"></pre><button class="cp" data-t="o2">Copy</button></div>
<div class="toast" id="t"></div>
<script src="app.js"></script>
</body>
